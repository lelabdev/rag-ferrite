# rag-ferrite tag-rules.toml
# Tag normalization and filtering rules.
# Loaded at startup from the same directory as config.toml.
# Edit freely — no recompilation needed.

[synonyms]
# Each key maps to its canonical form.
# Applied after lowercase + special char stripping.
# Use lowercase keys only.

