[package]
name = "rag-ferrite"
version = "5.2.0"
edition = "2024"
description = "Hybrid RAG engine — semantic + keyword search, MCP-native, single binary"
license = "MIT"
repository = "https://github.com/lelabdev/rag-ferrite"

[[bin]]
name = "ragfer"
path = "src/main.rs"
homepage = "https://github.com/lelabdev/rag-ferrite"
keywords = ["rag", "mcp", "search", "embedding", "hybrid"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
# RAG core

# MCP server
rmcp = { version = "1.6", features = ["server", "transport-io", "transport-streamable-http-server"] }
dotenvy = "0.15"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
toml = "0.8"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client (embedding API calls)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Web framework (REST API)
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# Utility
regex = "1"
dirs = "6"
chrono = "0.4.44"
once_cell = "1"
ureq = { version = "2", features = ["json"] }
rand = "0.9"
shellexpand = "3"
ratatui = "0.29"
crossterm = "0.28"

# Use our fork with mmap support for vector data
